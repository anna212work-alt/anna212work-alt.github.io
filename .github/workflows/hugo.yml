# Tự động build bằng Hugo và đăng lên GitHub Pages mỗi khi bạn đẩy (push) thay đổi lên nhánh main.
# Khác với bài hướng dẫn gốc: workflow này tự chạy lệnh `hugo`, nên bạn KHÔNG cần cài Hugo trên máy.
name: Dang website len GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cai Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.139.4"
          extended: true
      - name: Cau hinh Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build website
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Dong goi
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dang len GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
