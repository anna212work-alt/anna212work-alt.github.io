# ===== SỔ QUÁN ĂN =====
# Mỗi quán là một khối bắt đầu bằng "- id:". Mỗi quán tự có trang riêng: /quan-an/<id>/
# sample: true = quán MẪU (hiện nhãn "mẫu"). Quán thật thì để sample: false.
#
#   id            tên ngắn không dấu, không trùng
#   name          tên quán
#   type          loại: Bún/Phở, Xôi, Cơm, Cà phê, Ăn vặt, Nhà hàng...
#   area          khu vực (phường/quận), address: địa chỉ, map: link Google Maps
#   hours         giờ mở cửa ; price: khoảng giá/người ; price_date: ngày ghi giá
#   rating        điểm tổng (trên 10) ; scores: từng tiêu chí (trên 10)
#   dishes        món đã ăn: [tên món, giá, ghi chú]
#   visits        những lần đến: date, with (đi cùng ai), note
#   kids          có hợp đưa con nhỏ đi không ; parking: chỗ để xe
#   revisit       có quay lại không
#   tip           mẹo nhỏ ; post: đường dẫn bài viết liên quan (nếu có)

