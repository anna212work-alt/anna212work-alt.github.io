# ===== CẤU HÌNH CHÍNH CỦA WEBSITE =====
baseURL: "https://anna212work-alt.github.io/"
languageCode: "vi"
defaultContentLanguage: "vi"
title: "Sổ tay của Anna"
theme: "sotay"
enableEmoji: true
removePathAccents: true
titleCaseStyle: "none"
summaryLength: 30

params:
  tagline: "Lưu giữ những ngày bình thường của gia đình mình"
  description: "Nhật ký đời thường nhẹ nhàng của một gia đình nhỏ: món ngon, sách hay, chuyện con cái, những ngày bình thường và vài suy nghĩ về cách sống. Kèm đánh giá thật, đủ thông số, cho những món đồ mình dùng mỗi ngày."
  author: "Anna"
  # Link form đăng ký nhận quà (Google Form, MailerLite...). Dán link của bạn vào đây.
  leadFormURL: "https://forms.gle/DAN-LINK-GOOGLE-FORM-CUA-BAN"
  # Link tải quà, hiện ở trang Cảm ơn.
  giftDownloadURL: "https://drive.google.com/DAN-LINK-FILE-QUA"
  giftName: "Sổ tay 30 ngày ghi lại điều nhỏ"
  tiktok: "https://www.tiktok.com/@ten-cua-ban"
  facebook: "https://www.facebook.com/ten-cua-ban"
  email: "email-hop-tac@gmail.com"

taxonomies:
  category: "categories"
  tag: "tags"

outputs:
  home: ["HTML", "RSS", "JSON"]

menus:
  main:
    - name: "Trang chủ"
      url: "/"
      weight: 1
    - name: "Nhật ký"
      url: "/posts/"
      weight: 2
    - name: "Sổ quán ăn"
      url: "/quan-an/"
      weight: 3
    - name: "Món nhỏ mình thương"
      url: "/do-dung/"
      weight: 4
    - name: "So sánh"
      url: "/review/"
      weight: 5
    - name: "Về Anna"
      url: "/ve-anna/"
      weight: 6
  footer:
    - name: "Hợp tác"
      url: "/hop-tac/"
      weight: 1
    - name: "Công khai affiliate"
      url: "/cong-khai-affiliate/"
      weight: 2
    - name: "Chính sách bảo mật"
      url: "/chinh-sach-bao-mat/"
      weight: 3
    - name: "Tìm kiếm"
      url: "/tim-kiem/"
      weight: 4

related:
  includeNewer: true
  threshold: 0
  toLower: true
  indices:
    - name: categories
      weight: 100
    - name: tags
      weight: 80
    - name: date
      weight: 10

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
